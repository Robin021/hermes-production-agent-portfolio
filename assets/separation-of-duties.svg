<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker>
    <marker id="deny" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><circle cx="5" cy="5" r="4" fill="none" stroke="#c0392b" stroke-width="1.6"/><line x1="2.2" y1="7.8" x2="7.8" y2="2.2" stroke="#c0392b" stroke-width="1.6"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1400" height="780" fill="#ffffff"/>

  <text x="48" y="56" font-size="30" font-weight="700" fill="#0b1220">Seven principals. No single credential can do two dangerous things.</text>
  <text x="48" y="88" font-size="17" fill="#5b6472">Each row is a separate database login. The grants are not documentation &#8212; they are 327 assertions run against the live database, including 42 negative probes.</text>

  <text x="430" y="138" font-size="12" font-weight="700" fill="#8792a4" text-anchor="middle">read business</text>
  <text x="620" y="138" font-size="12" font-weight="700" fill="#8792a4" text-anchor="middle">append audit</text>
  <text x="810" y="138" font-size="12" font-weight="700" fill="#8792a4" text-anchor="middle">approval</text>
  <text x="1000" y="138" font-size="12" font-weight="700" fill="#8792a4" text-anchor="middle">mail draft</text>
  <text x="1190" y="138" font-size="12" font-weight="700" fill="#8792a4" text-anchor="middle">business WRITE</text>
  <text x="215" y="138" font-size="12" font-weight="700" fill="#8792a4" text-anchor="middle">PRINCIPAL</text>
  <line x1="48" y1="150" x2="1352" y2="150" stroke="#dde3ec" stroke-width="1.4"/>
  <rect x="48" y="172" width="350" height="52" rx="10" fill="#eef0fb" stroke="#4a54b8" stroke-width="1.6" filter="url(#sh)"/>
  <text x="66" y="196" font-size="15" font-weight="700" fill="#0b1220" text-anchor="start">Customer Ops Agent</text>
  <text x="66" y="214" font-size="11" fill="#5b6472" text-anchor="start">the LLM. no DB login at all</text>
  <rect x="388" y="187" width="84" height="22" rx="11" fill="#f0f3f8" stroke="#a9b3c2" stroke-width="1.2"/>
  <text x="430" y="202" font-size="10" font-weight="600" fill="#5b6472" text-anchor="middle">via tools</text>
  <text x="620" y="203" font-size="15" fill="#c8ccd4" text-anchor="middle">&#183;</text>
  <text x="810" y="203" font-size="15" fill="#c8ccd4" text-anchor="middle">&#183;</text>
  <text x="1000" y="203" font-size="15" fill="#c8ccd4" text-anchor="middle">&#183;</text>
  <circle cx="1190" cy="198" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="1185" y1="203" x2="1195" y2="193" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="48" y="234" width="350" height="52" rx="10" fill="#eef6ef" stroke="#2e8b57" stroke-width="1.6" filter="url(#sh)"/>
  <text x="66" y="258" font-size="15" font-weight="700" fill="#0b1220" text-anchor="start">business read role</text>
  <text x="66" y="276" font-size="11" fill="#5b6472" text-anchor="start">SELECT on 6 views, nothing else</text>
  <circle cx="430" cy="260" r="11" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.8"/>
  <path d="M 425 260 L 429 264 L 435.5 255.5" fill="none" stroke="#1d7a45" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="620" cy="260" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="615" y1="265" x2="625" y2="255" stroke="#c0392b" stroke-width="2.2"/>
  <circle cx="810" cy="260" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="805" y1="265" x2="815" y2="255" stroke="#c0392b" stroke-width="2.2"/>
  <circle cx="1000" cy="260" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="995" y1="265" x2="1005" y2="255" stroke="#c0392b" stroke-width="2.2"/>
  <circle cx="1190" cy="260" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="1185" y1="265" x2="1195" y2="255" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="48" y="296" width="350" height="52" rx="10" fill="#eef6ef" stroke="#2e8b57" stroke-width="1.6" filter="url(#sh)"/>
  <text x="66" y="320" font-size="15" font-weight="700" fill="#0b1220" text-anchor="start">audit writer</text>
  <text x="66" y="338" font-size="11" fill="#5b6472" text-anchor="start">INSERT only. cannot UPDATE its own rows</text>
  <circle cx="430" cy="322" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="425" y1="327" x2="435" y2="317" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="578" y="311" width="84" height="22" rx="11" fill="#f0f3f8" stroke="#a9b3c2" stroke-width="1.2"/>
  <text x="620" y="326" font-size="10" font-weight="600" fill="#5b6472" text-anchor="middle">append</text>
  <circle cx="810" cy="322" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="805" y1="327" x2="815" y2="317" stroke="#c0392b" stroke-width="2.2"/>
  <circle cx="1000" cy="322" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="995" y1="327" x2="1005" y2="317" stroke="#c0392b" stroke-width="2.2"/>
  <circle cx="1190" cy="322" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="1185" y1="327" x2="1195" y2="317" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="48" y="358" width="350" height="52" rx="10" fill="#fffbe6" stroke="#c8971b" stroke-width="1.6" filter="url(#sh)"/>
  <text x="66" y="382" font-size="15" font-weight="700" fill="#0b1220" text-anchor="start">approval runtime</text>
  <text x="66" y="400" font-size="11" fill="#5b6472" text-anchor="start">open, decide, expire, sweep</text>
  <circle cx="430" cy="384" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="425" y1="389" x2="435" y2="379" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="578" y="373" width="84" height="22" rx="11" fill="#f0f3f8" stroke="#a9b3c2" stroke-width="1.2"/>
  <text x="620" y="388" font-size="10" font-weight="600" fill="#5b6472" text-anchor="middle">append</text>
  <circle cx="810" cy="384" r="11" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.8"/>
  <path d="M 805 384 L 809 388 L 815.5 379.5" fill="none" stroke="#1d7a45" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="1000" cy="384" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="995" y1="389" x2="1005" y2="379" stroke="#c0392b" stroke-width="2.2"/>
  <circle cx="1190" cy="384" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="1185" y1="389" x2="1195" y2="379" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="48" y="420" width="350" height="52" rx="10" fill="#eef4fb" stroke="#3a7ac0" stroke-width="1.6" filter="url(#sh)"/>
  <text x="66" y="444" font-size="15" font-weight="700" fill="#0b1220" text-anchor="start">mail runtime</text>
  <text x="66" y="462" font-size="11" fill="#5b6472" text-anchor="start">can OPEN an approval, cannot decide one</text>
  <circle cx="430" cy="446" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="425" y1="451" x2="435" y2="441" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="578" y="435" width="84" height="22" rx="11" fill="#f0f3f8" stroke="#a9b3c2" stroke-width="1.2"/>
  <text x="620" y="450" font-size="10" font-weight="600" fill="#5b6472" text-anchor="middle">append</text>
  <rect x="768" y="435" width="84" height="22" rx="11" fill="#f0f3f8" stroke="#a9b3c2" stroke-width="1.2"/>
  <text x="810" y="450" font-size="10" font-weight="600" fill="#5b6472" text-anchor="middle">open only</text>
  <circle cx="1000" cy="446" r="11" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.8"/>
  <path d="M 995 446 L 999 450 L 1005.5 441.5" fill="none" stroke="#1d7a45" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="1190" cy="446" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="1185" y1="451" x2="1195" y2="441" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="48" y="482" width="350" height="52" rx="10" fill="#f2eefb" stroke="#7a4ab8" stroke-width="1.6" filter="url(#sh)"/>
  <text x="66" y="506" font-size="15" font-weight="700" fill="#0b1220" text-anchor="start">executor</text>
  <text x="66" y="524" font-size="11" fill="#5b6472" text-anchor="start">the only principal that can write</text>
  <circle cx="430" cy="508" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="425" y1="513" x2="435" y2="503" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="578" y="497" width="84" height="22" rx="11" fill="#f0f3f8" stroke="#a9b3c2" stroke-width="1.2"/>
  <text x="620" y="512" font-size="10" font-weight="600" fill="#5b6472" text-anchor="middle">append</text>
  <rect x="768" y="497" width="84" height="22" rx="11" fill="#f0f3f8" stroke="#a9b3c2" stroke-width="1.2"/>
  <text x="810" y="512" font-size="10" font-weight="600" fill="#5b6472" text-anchor="middle">read only</text>
  <circle cx="1000" cy="508" r="11" fill="#fdeeee" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="995" y1="513" x2="1005" y2="503" stroke="#c0392b" stroke-width="2.2"/>
  <circle cx="1190" cy="508" r="11" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.8"/>
  <path d="M 1185 508 L 1189 512 L 1195.5 503.5" fill="none" stroke="#1d7a45" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="48" y="544" width="350" height="52" rx="10" fill="#f5f6f8" stroke="#8792a4" stroke-width="1.6" filter="url(#sh)"/>
  <text x="66" y="568" font-size="15" font-weight="700" fill="#0b1220" text-anchor="start">schema owner</text>
  <text x="66" y="586" font-size="11" fill="#5b6472" text-anchor="start">migrations only. never a runtime credential</text>
  <rect x="388" y="559" width="84" height="22" rx="11" fill="#f0f3f8" stroke="#a9b3c2" stroke-width="1.2"/>
  <text x="430" y="574" font-size="10" font-weight="600" fill="#5b6472" text-anchor="middle">admin</text>
  <rect x="578" y="559" width="84" height="22" rx="11" fill="#f0f3f8" stroke="#a9b3c2" stroke-width="1.2"/>
  <text x="620" y="574" font-size="10" font-weight="600" fill="#5b6472" text-anchor="middle">admin</text>
  <rect x="768" y="559" width="84" height="22" rx="11" fill="#f0f3f8" stroke="#a9b3c2" stroke-width="1.2"/>
  <text x="810" y="574" font-size="10" font-weight="600" fill="#5b6472" text-anchor="middle">admin</text>
  <rect x="958" y="559" width="84" height="22" rx="11" fill="#f0f3f8" stroke="#a9b3c2" stroke-width="1.2"/>
  <text x="1000" y="574" font-size="10" font-weight="600" fill="#5b6472" text-anchor="middle">admin</text>
  <rect x="1148" y="559" width="84" height="22" rx="11" fill="#f0f3f8" stroke="#a9b3c2" stroke-width="1.2"/>
  <text x="1190" y="574" font-size="10" font-weight="600" fill="#5b6472" text-anchor="middle">admin</text>
  <rect x="48" y="626" width="640" height="112" rx="12" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="72" y="656" font-size="15" font-weight="700" fill="#8a2622" text-anchor="start">The separation that matters most</text>
  <text x="72" y="682" font-size="13" fill="#8a4a46" text-anchor="start">The mail runtime can <tspan font-weight="700">open</tspan> an approval request but has <tspan font-weight="700">no verb at all</tspan> on the</text>
  <text x="72" y="702" font-size="13" fill="#8a4a46" text-anchor="start">decision table. So the credential that reads untrusted email cannot</text>
  <text x="72" y="722" font-size="13" fill="#8a4a46" text-anchor="start">file a refund request <tspan font-weight="700">and</tspan> approve it. Not by policy &#8212; by grant.</text>
  <rect x="712" y="626" width="640" height="112" rx="12" fill="#eef6ef" stroke="#2e8b57" stroke-width="2"/>
  <text x="736" y="656" font-size="15" font-weight="700" fill="#1d5c39" text-anchor="start">Why the schema owner is not a runtime credential</text>
  <text x="736" y="682" font-size="13" fill="#3f6b52" text-anchor="start">Owner rights exist for migrations and maintenance. No runtime process</text>
  <text x="736" y="702" font-size="13" fill="#3f6b52" text-anchor="start">holds them, and a restore drill re-runs the whole privilege matrix against</text>
  <text x="736" y="722" font-size="13" fill="#3f6b52" text-anchor="start">the restored copy &#8212; because a restore once quietly widened them.</text>
</svg>
