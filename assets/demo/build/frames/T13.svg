<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#0d1117"/><rect x="0" y="936" width="1920" height="144" fill="#010409"/><rect x="0" y="936" width="1920" height="2" fill="#30363d"/><text x="960" y="1022" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#e6edf3" text-anchor="middle">Execution is a separate command under a separate login, re-validated inside the transaction.</text><text x="72" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" letter-spacing="3">EXECUTION</text><text x="1848" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#484f58" text-anchor="end" letter-spacing="2">SYNTHETIC FIXTURE · NO CUSTOMER DATA</text><rect x="72" y="218" width="1776" height="584" fill="#161b22" rx="12" stroke="#30363d" stroke-width="2"/><rect x="72" y="218" width="1776" height="56" fill="#1c2128" rx="12"/><rect x="72" y="272" width="1776" height="2" fill="#30363d"/><circle cx="110" cy="246" r="8" fill="#484f58"/><circle cx="140" cy="246" r="8" fill="#484f58"/><circle cx="170" cy="246" r="8" fill="#484f58"/><text x="960" y="255" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">executor session · separate login</text><text x="120" y="330" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="32" fill="#e6edf3" font-weight="600" xml:space="preserve">$ executor-cli execute --approval &lt;APPROVAL_ID&gt;</text><text x="120" y="382" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#8b949e" xml:space="preserve">  direct INSERT / UPDATE / DELETE granted to this login:  none</text><text x="120" y="424" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#8b949e" xml:space="preserve">  callable functions:  3</text><text x="120" y="488" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#58a6ff" xml:space="preserve">  revalidating inside the transaction</text><text x="120" y="530" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">    ✓ approval still approved, still unexpired, still unconsumed</text><text x="120" y="572" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">    ✓ snapshot hash matches the entity as it is now</text><text x="120" y="614" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">    ✓ entity state still permits the action</text><text x="120" y="678" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">  committed        rows_written=1   execution_id &lt;EXECUTION_ID&gt;</text><text x="120" y="720" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#8b949e" xml:space="preserve">  changing a customer address is not blocked · no function takes one</text></svg>