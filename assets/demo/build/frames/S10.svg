<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#0d1117"/><rect x="0" y="936" width="1920" height="144" fill="#010409"/><rect x="0" y="936" width="1920" height="2" fill="#30363d"/><text x="960" y="1022" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#e6edf3" text-anchor="middle">The approval is recorded — and business state is byte-identical. Approving is not executing.</text><text x="72" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" letter-spacing="3">THE PART MOST DESIGNS GET WRONG</text><text x="1848" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#484f58" text-anchor="end" letter-spacing="2">SYNTHETIC FIXTURE · NO CUSTOMER DATA</text><rect x="72" y="243" width="872" height="404" fill="#161b22" rx="14" stroke="#30363d" stroke-width="2"/><rect x="72" y="243" width="872" height="6" fill="#3fb950" rx="3"/><text x="112" y="323" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#3fb950" font-weight="700" letter-spacing="2">APPROVAL RECORDED</text><text x="112" y="405" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">decision      approved</text><text x="112" y="451" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">decided_by    &lt;OPERATOR_ID&gt;</text><text x="112" y="497" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">decision_id   &lt;DECISION_ID&gt;</text><text x="112" y="543" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">recorded_at   +0.4s</text><text x="112" y="613" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">an authorization exists</text><rect x="976" y="243" width="872" height="404" fill="#161b22" rx="14" stroke="#30363d" stroke-width="2"/><rect x="976" y="243" width="872" height="6" fill="#3fb950" rx="3"/><text x="1016" y="323" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#3fb950" font-weight="700" letter-spacing="2">BUSINESS STATE UNCHANGED</text><text x="1016" y="405" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">order status  unchanged</text><text x="1016" y="451" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">refund rows   0</text><text x="1016" y="497" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">table hash    &lt;SHA256_OF_CANONICAL_SNAPSHOT&gt;</text><text x="1016" y="543" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">              · identical to before</text><text x="1016" y="613" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">nothing consumes approvals automatically</text><text x="960" y="739" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#d29922" font-weight="700" text-anchor="middle">approve ≠ execute</text></svg>