<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#0d1117"/><rect x="0" y="936" width="1920" height="144" fill="#010409"/><rect x="0" y="936" width="1920" height="2" fill="#30363d"/><text x="960" y="1022" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#e6edf3" text-anchor="middle">Twenty concurrent passes, still exactly one draft. Guaranteed by a unique index.</text><text x="72" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" letter-spacing="3">IDEMPOTENCY</text><text x="1848" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#484f58" text-anchor="end" letter-spacing="2">SYNTHETIC FIXTURE · NO CUSTOMER DATA</text><text x="72" y="190" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#58a6ff" letter-spacing="5">LIVE MAILBOXES REDELIVER</text><text x="72" y="290" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="30" fill="#3fb950" xml:space="preserve">$ twenty concurrent passes -&gt; still exactly one draft</text><text x="72" y="336" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="30" fill="#3fb950" xml:space="preserve">$ the guarantee is in the database, not in the code</text><text x="72" y="408" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="30" fill="#3fb950" xml:space="preserve">  passed 48 / failed 0</text><text x="72" y="480" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="30" fill="#3fb950" xml:space="preserve">  reprocess &lt;MESSAGE_ID_A&gt;  -&gt;  reused, duplicate: true</text><text x="72" y="526" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="30" fill="#3fb950" xml:space="preserve">  drafts for this thread    -&gt;  1</text><text x="72" y="880" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#484f58">a unique index · not a retry counter, not a lock held in application memory</text></svg>