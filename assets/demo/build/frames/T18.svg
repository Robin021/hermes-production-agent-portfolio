<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#0d1117"/><rect x="0" y="936" width="1920" height="144" fill="#010409"/><rect x="0" y="936" width="1920" height="2" fill="#30363d"/><text x="960" y="1022" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#e6edf3" text-anchor="middle">The provider offers no draft-only scope. What is proven is that no code path can express a send.</text><text x="72" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" letter-spacing="3">THE HONEST PART</text><text x="1848" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#484f58" text-anchor="end" letter-spacing="2">SYNTHETIC FIXTURE · NO CUSTOMER DATA</text><rect x="72" y="220" width="872" height="450" fill="#161b22" rx="14" stroke="#30363d" stroke-width="2"/><rect x="72" y="220" width="872" height="6" fill="#3fb950" rx="3"/><text x="112" y="300" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#3fb950" font-weight="700" letter-spacing="2">WHAT IS PROVEN</text><text x="112" y="382" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">no code path can express a send</text><text x="112" y="428" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">one choke point for all mail calls</text><text x="112" y="474" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">a closed table of 7 operations</text><text x="112" y="520" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">an import guard that fails hard</text><text x="112" y="566" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">440 structural assertions</text><text x="112" y="636" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">mechanically checked, every run</text><rect x="976" y="220" width="872" height="450" fill="#161b22" rx="14" stroke="#30363d" stroke-width="2"/><rect x="976" y="220" width="872" height="6" fill="#f85149" rx="3"/><text x="1016" y="300" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#f85149" font-weight="700" letter-spacing="2">WHAT IS NOT</text><text x="1016" y="382" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">the provider has no draft-only</text><text x="1016" y="428" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">scope, so the token is</text><text x="1016" y="474" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">technically capable of sending</text><text x="1016" y="520" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve"></text><text x="1016" y="566" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="27" fill="#e6edf3" xml:space="preserve">that is a different claim</text><text x="1016" y="636" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">said on camera, not buried in a footnote</text><text x="960" y="762" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#d29922" font-weight="700" text-anchor="middle">a real boundary ≠ impossible</text></svg>