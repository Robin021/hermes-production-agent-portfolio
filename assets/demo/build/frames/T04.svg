<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#0d1117"/><rect x="0" y="936" width="1920" height="144" fill="#010409"/><rect x="0" y="936" width="1920" height="2" fill="#30363d"/><text x="960" y="1022" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#e6edf3" text-anchor="middle">One named message in, one grounded draft out, in the original thread.</text><text x="72" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" letter-spacing="3">CASE A · THE NORMAL PATH</text><text x="1848" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#484f58" text-anchor="end" letter-spacing="2">SYNTHETIC FIXTURE · NO CUSTOMER DATA</text><rect x="72" y="208" width="1776" height="604" fill="#161b22" rx="12" stroke="#30363d" stroke-width="2"/><rect x="72" y="208" width="1776" height="56" fill="#1c2128" rx="12"/><rect x="72" y="262" width="1776" height="2" fill="#30363d"/><circle cx="110" cy="236" r="8" fill="#484f58"/><circle cx="140" cy="236" r="8" fill="#484f58"/><circle cx="170" cy="236" r="8" fill="#484f58"/><text x="960" y="245" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">operator session</text><text x="120" y="320" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="32" fill="#e6edf3" font-weight="600" xml:space="preserve">$ mail-cli process --message-id &lt;MESSAGE_ID_A&gt;</text><text x="120" y="372" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#8b949e" xml:space="preserve">  intent           order_status      risk  low</text><text x="120" y="414" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#58a6ff" xml:space="preserve">  tool call        get_order_status(order_ref="SO-1001")</text><text x="120" y="456" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">  returned         status=in_transit  carrier_ref=TRK-55012</text><text x="120" y="498" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">  grounded         True   (explicit verdict, required)</text><text x="120" y="562" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">  draft            &lt;DRAFT_ID_A&gt;</text><text x="120" y="604" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">  thread           &lt;THREAD_ID_A&gt;   ·   derived from the source message</text><text x="120" y="646" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">  to               customer@example.com   ·   pure function of the sender</text><text x="120" y="688" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">  cc / bcc         empty / empty</text><text x="120" y="730" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">  sent             0</text></svg>