<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#0d1117"/><rect x="0" y="936" width="1920" height="144" fill="#010409"/><rect x="0" y="936" width="1920" height="2" fill="#30363d"/><text x="960" y="1022" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#e6edf3" text-anchor="middle">The agent reads one named message and looks up the order through a typed, read-only tool.</text><text x="72" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" letter-spacing="3">CASE A · THE AGENT READS</text><text x="1848" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#484f58" text-anchor="end" letter-spacing="2">SYNTHETIC FIXTURE · NO CUSTOMER DATA</text><rect x="72" y="260" width="1776" height="500" fill="#161b22" rx="12" stroke="#30363d" stroke-width="2"/><rect x="72" y="260" width="1776" height="56" fill="#1c2128" rx="12"/><rect x="72" y="314" width="1776" height="2" fill="#30363d"/><circle cx="110" cy="288" r="8" fill="#484f58"/><circle cx="140" cy="288" r="8" fill="#484f58"/><circle cx="170" cy="288" r="8" fill="#484f58"/><text x="960" y="297" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">operator session</text><text x="120" y="372" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="32" fill="#e6edf3" font-weight="600" xml:space="preserve">$ mail-cli process --message-id &lt;MESSAGE_ID_A&gt;</text><text x="120" y="424" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#8b949e" xml:space="preserve">  fetch          one named message, read scope only</text><text x="120" y="466" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#8b949e" xml:space="preserve">  classify       intent=order_status   risk=low   deterministic</text><text x="120" y="530" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#58a6ff" xml:space="preserve">  tool call      get_order_status(order_ref="SO-1001")</text><text x="120" y="572" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#8b949e" xml:space="preserve">  tool kind      read-only · typed arguments · no SQL surface</text><text x="120" y="614" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">  returned       status=in_transit  carrier_ref=TRK-55012  eta=2 days</text><text x="120" y="678" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#8b949e" xml:space="preserve">  writes available to the agent runtime: none</text></svg>