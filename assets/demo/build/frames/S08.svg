<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#0d1117"/><rect x="0" y="936" width="1920" height="144" fill="#010409"/><rect x="0" y="936" width="1920" height="2" fill="#30363d"/><text x="960" y="1022" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#e6edf3" text-anchor="middle">The agent stops at awaiting_approval and writes no business row. It never had the permission to.</text><text x="72" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" letter-spacing="3">CASE D · IT STOPS</text><text x="1848" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#484f58" text-anchor="end" letter-spacing="2">SYNTHETIC FIXTURE · NO CUSTOMER DATA</text><rect x="72" y="239" width="1776" height="542" fill="#161b22" rx="12" stroke="#30363d" stroke-width="2"/><rect x="72" y="239" width="1776" height="56" fill="#1c2128" rx="12"/><rect x="72" y="293" width="1776" height="2" fill="#30363d"/><circle cx="110" cy="267" r="8" fill="#484f58"/><circle cx="140" cy="267" r="8" fill="#484f58"/><circle cx="170" cy="267" r="8" fill="#484f58"/><text x="960" y="276" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" text-anchor="middle">operator session</text><text x="120" y="351" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="32" fill="#e6edf3" font-weight="600" xml:space="preserve">$ mail-cli process --message-id &lt;MESSAGE_ID_D&gt;</text><text x="120" y="403" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#8b949e" xml:space="preserve">  classify            intent=refund_request   risk=high   deterministic</text><text x="120" y="445" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#8b949e" xml:space="preserve">  policy              high risk → open approval, write nothing</text><text x="120" y="509" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#d29922" xml:space="preserve">  status              awaiting_approval</text><text x="120" y="551" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">  business_rows_written  0</text><text x="120" y="593" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">  drafts_created      1   (acknowledgement only, not sent)</text><text x="120" y="635" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#3fb950" xml:space="preserve">  approval_id         &lt;APPROVAL_ID&gt;</text><text x="120" y="699" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="29" fill="#8b949e" xml:space="preserve">  the agent login holds no INSERT, UPDATE or DELETE on business tables</text></svg>