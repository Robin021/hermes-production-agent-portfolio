<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#0d1117"/><rect x="0" y="936" width="1920" height="144" fill="#010409"/><rect x="0" y="936" width="1920" height="2" fill="#30363d"/><text x="960" y="1022" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#e6edf3" text-anchor="middle">AI can reason. It cannot authorize itself, and it cannot write.</text><rect x="0" y="0" width="1920" height="6" fill="#3fb950"/><text x="960" y="260" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" fill="#e6edf3" font-weight="600" text-anchor="middle">AI can reason.</text><text x="960" y="376" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" fill="#e6edf3" font-weight="600" text-anchor="middle">AI cannot self-authorize.</text><text x="960" y="492" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" fill="#e6edf3" font-weight="600" text-anchor="middle">AI cannot directly write.</text><text x="960" y="608" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" fill="#e6edf3" font-weight="600" text-anchor="middle">Human approval does not equal execution.</text><text x="960" y="724" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" fill="#e6edf3" font-weight="600" text-anchor="middle">Every state change is auditable.</text><text x="960" y="880" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#484f58" text-anchor="middle">2,627 assertions · 0 failures · 0 emails sent</text></svg>