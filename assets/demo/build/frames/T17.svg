<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#0d1117"/><rect x="0" y="936" width="1920" height="144" fill="#010409"/><rect x="0" y="936" width="1920" height="2" fill="#30363d"/><text x="960" y="1000" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#e6edf3" text-anchor="middle">The bug worth showing: a restored database granted EXECUTE to PUBLIC. Found by a probe, not a</text><text x="960" y="1044" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#e6edf3" text-anchor="middle">review.</text><text x="72" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" letter-spacing="3">THE BUG WORTH SHOWING</text><text x="1848" y="66" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#484f58" text-anchor="end" letter-spacing="2">SYNTHETIC FIXTURE · NO CUSTOMER DATA</text><text x="72" y="190" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" fill="#f85149" letter-spacing="5">FOUND BY A PROBE, NOT BY A REVIEW</text><text x="72" y="290" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" fill="#e6edf3">Grant replay after a restore scanned migration text</text><text x="72" y="348" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" fill="#e6edf3">and silently skipped grants written inside procedural blocks.</text><text x="72" y="406" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" fill="#e6edf3">PostgreSQL grants EXECUTE to PUBLIC by default.</text><text x="72" y="490" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" fill="#e6edf3">So a restored database briefly let any login call the</text><text x="72" y="548" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" fill="#e6edf3">executor functions directly.</text><text x="72" y="632" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="30" fill="#3fb950" xml:space="preserve">$ restore drill: re-run all 327 privilege assertions</text><text x="72" y="678" font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace" font-size="30" fill="#3fb950" xml:space="preserve">  against the restored copy   -&gt;   327 passed, 0 failed</text><text x="72" y="880" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#484f58">fix: explicit revoke from PUBLIC, plus a parser that reads procedural blocks</text></svg>