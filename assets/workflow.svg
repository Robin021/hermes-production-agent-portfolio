<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="arwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1400" height="640" fill="#ffffff"/>

  <text x="48" y="58" font-size="30" font-weight="700" fill="#0b1220">The agent drafts the reply. It has no capability to send it.</text>
  <text x="48" y="90" font-size="17" fill="#5b6472">Inbound customer message to reviewed draft. Every box is a separate process; the LLM appears exactly once.</text>

  <rect x="48" y="120" width="1304" height="200" rx="14" fill="#f7f9fc" stroke="#dde3ec"/>
  <text x="68" y="148" font-size="13" font-weight="700" letter-spacing="1.2" fill="#8792a4">LOW-RISK PATH — INFORMATIONAL ANSWER</text>

  <rect x="68" y="168" width="190" height="92" rx="10" fill="#fdeeee" stroke="#d9534f" stroke-width="1.6" filter="url(#sh)"/>
  <text x="163" y="202" font-size="16" font-weight="700" fill="#8a2622" text-anchor="middle">Customer email</text>
  <text x="163" y="226" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">UNTRUSTED INPUT</text>
  <text x="163" y="244" font-size="11" font-weight="400" fill="#8a6d6b" text-anchor="middle">body may contain instructions</text>
  <rect x="282" y="168" width="190" height="92" rx="10" fill="#eef6ef" stroke="#2e8b57" stroke-width="1.6" filter="url(#sh)"/>
  <text x="377" y="198" font-size="16" font-weight="700" fill="#1d5c39" text-anchor="middle">Gmail Adapter</text>
  <text x="377" y="220" font-size="11" font-weight="400" fill="#4a6b58" text-anchor="middle">read + compose scopes</text>
  <text x="377" y="240" font-size="11" font-weight="700" fill="#2e8b57" text-anchor="middle">GET mutates nothing</text>
  <rect x="496" y="168" width="190" height="92" rx="10" fill="#eef0fb" stroke="#4a54b8" stroke-width="1.6" filter="url(#sh)"/>
  <text x="591" y="198" font-size="16" font-weight="700" fill="#2e3690" text-anchor="middle">Customer Ops Agent</text>
  <text x="591" y="220" font-size="11" font-weight="400" fill="#5b6084" text-anchor="middle">the only LLM in the system</text>
  <text x="591" y="240" font-size="11" font-weight="700" fill="#4a54b8" text-anchor="middle">holds no credential</text>
  <rect x="710" y="168" width="190" height="92" rx="10" fill="#eef6ef" stroke="#2e8b57" stroke-width="1.6" filter="url(#sh)"/>
  <text x="805" y="194" font-size="16" font-weight="700" fill="#1d5c39" text-anchor="middle">Typed Read-Only</text>
  <text x="805" y="214" font-size="16" font-weight="700" fill="#1d5c39" text-anchor="middle">Business Tools</text>
  <text x="805" y="236" font-size="11" font-weight="400" fill="#4a6b58" text-anchor="middle">6 functions, 1 id each</text>
  <text x="805" y="251" font-size="10" font-weight="400" fill="#4a6b58" text-anchor="middle">no SQL / URL / header field</text>
  <rect x="924" y="168" width="190" height="92" rx="10" fill="#eef6ef" stroke="#2e8b57" stroke-width="1.6" filter="url(#sh)"/>
  <text x="1019" y="198" font-size="16" font-weight="700" fill="#1d5c39" text-anchor="middle">Deterministic Policy</text>
  <text x="1019" y="220" font-size="11" font-weight="400" fill="#4a6b58" text-anchor="middle">outcome from evidence,</text>
  <text x="1019" y="238" font-size="11" font-weight="400" fill="#4a6b58" text-anchor="middle">not from model wording</text>
  <rect x="1138" y="168" width="190" height="92" rx="10" fill="#fffbe6" stroke="#c8971b" stroke-width="1.6" filter="url(#sh)"/>
  <text x="1233" y="198" font-size="16" font-weight="700" fill="#8a6a08" text-anchor="middle">Gmail Draft</text>
  <text x="1233" y="222" font-size="12" font-weight="700" fill="#b8860b" text-anchor="middle">DRAFT — NOT SENT</text>
  <text x="1233" y="242" font-size="11" font-weight="400" fill="#8a7a4a" text-anchor="middle">a human presses Send</text>
  <line x1="262" y1="214" x2="276" y2="214" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="476" y1="214" x2="490" y2="214" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="690" y1="214" x2="704" y2="214" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="904" y1="214" x2="918" y2="214" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="1118" y1="214" x2="1132" y2="214" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M 805 268 C 805 294, 591 294, 591 268" fill="none" stroke="#8792a4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="698" y="310" font-size="11" font-weight="400" fill="#8792a4" text-anchor="middle">typed facts, or a typed error with a retryable flag</text>
  <rect x="48" y="344" width="1304" height="248" rx="14" fill="#fffafa" stroke="#f0d5d3"/>
  <text x="68" y="372" font-size="13" font-weight="700" letter-spacing="1.2" fill="#c0392b">HIGH-RISK PATH — ANYTHING THAT CHANGES BUSINESS STATE</text>
  <rect x="68" y="392" width="172" height="88" rx="10" fill="#eef0fb" stroke="#4a54b8" stroke-width="1.6" filter="url(#sh)"/>
  <text x="154" y="424" font-size="16" font-weight="700" fill="#2e3690" text-anchor="middle">Agent</text>
  <text x="154" y="448" font-size="11" font-weight="400" fill="#5b6084" text-anchor="middle">"I want a refund"</text>
  <text x="154" y="466" font-size="10" font-weight="400" fill="#5b6084" text-anchor="middle">may raise risk, never lower</text>
  <rect x="262" y="392" width="172" height="88" rx="10" fill="#eef6ef" stroke="#2e8b57" stroke-width="1.6" filter="url(#sh)"/>
  <text x="348" y="422" font-size="15" font-weight="700" fill="#1d5c39" text-anchor="middle">Approval Request</text>
  <text x="348" y="444" font-size="11" font-weight="400" fill="#4a6b58" text-anchor="middle">payload hashed</text>
  <text x="348" y="462" font-size="11" font-weight="400" fill="#4a6b58" text-anchor="middle">expires on a clock</text>
  <rect x="456" y="392" width="172" height="88" rx="10" fill="#fffbe6" stroke="#c8971b" stroke-width="1.6" filter="url(#sh)"/>
  <text x="542" y="422" font-size="15" font-weight="700" fill="#8a6a08" text-anchor="middle">Human Approval</text>
  <text x="542" y="444" font-size="11" font-weight="400" fill="#8a7a4a" text-anchor="middle">chat or CLI</text>
  <text x="542" y="462" font-size="10" font-weight="400" fill="#8a7a4a" text-anchor="middle">requester cannot approve</text>
  <rect x="650" y="392" width="196" height="88" rx="10" fill="#fdeeee" stroke="#c0392b" stroke-width="2.6" filter="url(#sh)"/>
  <text x="748" y="422" font-size="19" font-weight="800" fill="#c0392b" text-anchor="middle">STOP</text>
  <text x="748" y="444" font-size="11" font-weight="700" fill="#8a2622" text-anchor="middle">approved is TERMINAL</text>
  <text x="748" y="462" font-size="11" font-weight="400" fill="#8a6d6b" text-anchor="middle">business state unchanged</text>
  <rect x="872" y="392" width="172" height="88" rx="10" fill="#f2eefb" stroke="#7a4ab8" stroke-width="1.6" filter="url(#sh)"/>
  <text x="958" y="420" font-size="15" font-weight="700" fill="#54308a" text-anchor="middle">Explicit Executor</text>
  <text x="958" y="442" font-size="11" font-weight="400" fill="#6b5b84" text-anchor="middle">separate process,</text>
  <text x="958" y="460" font-size="11" font-weight="400" fill="#6b5b84" text-anchor="middle">separate credential</text>
  <rect x="1094" y="392" width="190" height="88" rx="10" fill="#eef6ef" stroke="#2e8b57" stroke-width="1.6" filter="url(#sh)"/>
  <text x="1189" y="420" font-size="15" font-weight="700" fill="#1d5c39" text-anchor="middle">One Verified</text>
  <text x="1189" y="440" font-size="15" font-weight="700" fill="#1d5c39" text-anchor="middle">Business Mutation</text>
  <text x="1189" y="462" font-size="11" font-weight="400" fill="#4a6b58" text-anchor="middle">idempotent by DB index</text>
  <line x1="244" y1="436" x2="256" y2="436" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="438" y1="436" x2="450" y2="436" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="632" y1="436" x2="644" y2="436" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="850" y1="436" x2="866" y2="436" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arwr)"/>
  <text x="861" y="382" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">a separate operator act</text>
  <text x="861" y="500" font-size="10" font-weight="400" fill="#c0392b" text-anchor="middle">no auto-consumer exists</text>
  <line x1="1048" y1="436" x2="1088" y2="436" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="1094" y="510" width="190" height="56" rx="10" fill="#eef4fb" stroke="#3a7ac0" stroke-width="1.6" filter="url(#sh)"/>
  <text x="1189" y="532" font-size="13" font-weight="700" fill="#245a92" text-anchor="middle">Telegram Notification</text>
  <text x="1189" y="552" font-size="10" font-weight="400" fill="#5b7a96" text-anchor="middle">outcome only, no button</text>
  <line x1="1189" y1="484" x2="1189" y2="504" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <text x="68" y="614" font-size="14" fill="#5b6472">An agent is not safe because it was instructed to behave. It is safe because the unsafe action is <tspan font-weight="700" fill="#0b1220">unrepresentable</tspan>.</text>
</svg>
