<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 890" width="1500" height="890" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/></marker>
    <marker id="arwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1500" height="890" fill="#ffffff"/>
  <text x="48" y="56" font-size="30" font-weight="700" fill="#0b1220">Approving a refund does not issue the refund.</text>
  <text x="48" y="88" font-size="17" fill="#5b6472">The high-risk path, in time order. Between step 4 and step 5 the business database is <tspan font-weight="700" fill="#0b1220">byte-for-byte unchanged</tspan> &#8212; and it stays that way until a human runs a second command.</text>

  <rect x="764" y="106" width="168" height="610" rx="12" fill="#fdeeee" opacity="0.75" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="848" y="136" font-size="16" font-weight="800" fill="#c0392b" text-anchor="middle">THE GAP</text>
  <text x="848" y="160" font-size="11.5" font-weight="600" fill="#8a2622" text-anchor="middle">authorization exists.</text>
  <text x="848" y="177" font-size="11.5" font-weight="600" fill="#8a2622" text-anchor="middle">nothing has been written.</text>
  <text x="848" y="686" font-size="10.5" font-weight="700" fill="#c0392b" text-anchor="middle">no auto-consumer</text>
  <text x="848" y="702" font-size="10.5" font-weight="700" fill="#c0392b" text-anchor="middle">polls this queue</text>

  <rect x="48" y="190" width="1404" height="80" rx="8" fill="#eef0fb" opacity="0.4"/>
  <text x="66" y="222" font-size="12" font-weight="700" letter-spacing="1" fill="#4a54b8">AGENT</text>
  <rect x="48" y="290" width="1404" height="80" rx="8" fill="#eef6ef" opacity="0.4"/>
  <text x="66" y="322" font-size="12" font-weight="700" letter-spacing="1" fill="#2e8b57">CONTROL PLANE</text>
  <rect x="48" y="390" width="1404" height="80" rx="8" fill="#fffbe6" opacity="0.4"/>
  <text x="66" y="422" font-size="12" font-weight="700" letter-spacing="1" fill="#c8971b">HUMAN</text>
  <rect x="48" y="490" width="1404" height="80" rx="8" fill="#f2eefb" opacity="0.4"/>
  <text x="66" y="522" font-size="12" font-weight="700" letter-spacing="1" fill="#7a4ab8">EXECUTOR</text>
  <rect x="48" y="590" width="1404" height="80" rx="8" fill="#fdeeee" opacity="0.4"/>
  <text x="66" y="622" font-size="12" font-weight="700" letter-spacing="1" fill="#c0392b">BUSINESS DATA</text>

  <rect x="180" y="194" width="186" height="72" rx="9" fill="#ffffff" stroke="#4a54b8" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="180" cy="194" r="13" fill="#4a54b8"/>
  <text x="180" y="199" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="273" y="220" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">refund requested</text>
  <text x="273" y="240" font-size="10.5" fill="#5b6472" text-anchor="middle">risk floor: HIGH</text>
  <rect x="330" y="294" width="186" height="72" rx="9" fill="#ffffff" stroke="#2e8b57" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="330" cy="294" r="13" fill="#2e8b57"/>
  <text x="330" y="299" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="423" y="320" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">approval opened</text>
  <text x="423" y="340" font-size="10.5" fill="#5b6472" text-anchor="middle">payload hashed, TTL set</text>
  <rect x="480" y="394" width="186" height="72" rx="9" fill="#ffffff" stroke="#c8971b" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="480" cy="394" r="13" fill="#c8971b"/>
  <text x="480" y="399" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="573" y="420" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">operator approves</text>
  <text x="573" y="440" font-size="10.5" fill="#5b6472" text-anchor="middle">requester cannot self-approve</text>
  <rect x="560" y="294" width="186" height="72" rx="9" fill="#ffffff" stroke="#2e8b57" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="560" cy="294" r="13" fill="#2e8b57"/>
  <text x="560" y="299" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="653" y="320" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">decision recorded</text>
  <text x="653" y="340" font-size="10.5" fill="#5b6472" text-anchor="middle">state = approved (TERMINAL)</text>
  <rect x="950" y="394" width="186" height="72" rx="9" fill="#ffffff" stroke="#c8971b" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="950" cy="394" r="13" fill="#c8971b"/>
  <text x="950" y="399" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1043" y="420" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">operator runs executor</text>
  <text x="1043" y="440" font-size="10.5" fill="#5b6472" text-anchor="middle">a second, explicit command</text>
  <rect x="1080" y="494" width="186" height="72" rx="9" fill="#ffffff" stroke="#7a4ab8" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="1080" cy="494" r="13" fill="#7a4ab8"/>
  <text x="1080" y="499" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="1173" y="520" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">preconditions re-checked</text>
  <text x="1173" y="540" font-size="10.5" fill="#5b6472" text-anchor="middle">approved &#183; unexpired</text>
  <text x="1173" y="556" font-size="10.5" fill="#5b6472" text-anchor="middle">payload hash must match</text>
  <rect x="1230" y="594" width="186" height="72" rx="9" fill="#ffffff" stroke="#c0392b" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="1230" cy="594" r="13" fill="#c0392b"/>
  <text x="1230" y="599" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <text x="1323" y="620" font-size="13" font-weight="700" fill="#0b1220" text-anchor="middle">ONE row written</text>
  <text x="1323" y="640" font-size="10.5" fill="#5b6472" text-anchor="middle">idempotent by unique index</text>

  <path d="M 273 266 C 273 286, 423 274, 423 292" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M 423 366 C 423 386, 573 374, 573 392" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M 668 424 C 706 424, 706 400, 706 368" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M 1043 466 C 1043 486, 1173 474, 1173 492" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M 1173 566 C 1173 586, 1323 574, 1323 592" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M 746 330 C 830 330, 866 430, 946 430" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="9 6" marker-end="url(#arwr)"/>

  <rect x="1239" y="730" width="168" height="62" rx="10" fill="#eef4fb" stroke="#3a7ac0" stroke-width="1.6" filter="url(#sh)"/>
  <text x="1323" y="755" font-size="13" font-weight="700" fill="#245a92" text-anchor="middle">Telegram</text>
  <text x="1323" y="774" font-size="10.5" fill="#5b7a96" text-anchor="middle">outcome notification</text>
  <line x1="1323" y1="668" x2="1323" y2="724" stroke="#5b6472" stroke-width="2" marker-end="url(#arw)"/>
  <text x="1229" y="706" font-size="10.5" fill="#8792a4" text-anchor="end">notification only &#183; no button executes anything</text>

  <rect x="48" y="730" width="560" height="128" rx="12" fill="#f7f9fc" stroke="#dde3ec" stroke-width="1.6"/>
  <text x="72" y="760" font-size="15" font-weight="700" fill="#0b1220">Why this cannot drift back to auto-execute</text>
  <text x="72" y="786" font-size="12.5" fill="#5b6472">The approval table has <tspan font-weight="700">no executed state</tspan>. There is nowhere for a</text>
  <text x="72" y="806" font-size="12.5" fill="#5b6472">background worker to write "I did it", so no background worker was</text>
  <text x="72" y="826" font-size="12.5" fill="#5b6472">written. Adding one would be a schema change, a new grant and a new</text>
  <text x="72" y="846" font-size="12.5" fill="#5b6472">privilege test &#8212; visible in a diff, not an accident.</text>
  <rect x="628" y="730" width="560" height="128" rx="12" fill="#f7f9fc" stroke="#dde3ec" stroke-width="1.6"/>
  <text x="652" y="760" font-size="15" font-weight="700" fill="#0b1220">If the executor crashes mid-write</text>
  <text x="652" y="786" font-size="12.5" fill="#5b6472">The attempt is claimed and <tspan font-weight="700">committed before</tspan> the write, so a crash</text>
  <text x="652" y="806" font-size="12.5" fill="#5b6472">leaves a searchable record rather than a mystery. Reconciliation</text>
  <text x="652" y="826" font-size="12.5" fill="#5b6472"><tspan font-weight="700">adopts</tspan> the orphan instead of retrying it, so the refund cannot</text>
  <text x="652" y="846" font-size="12.5" fill="#5b6472">be issued twice.</text>
</svg>
